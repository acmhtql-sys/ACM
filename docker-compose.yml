version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acm_user
      POSTGRES_PASSWORD: acm_password_dev2026
      POSTGRES_DB: acm_inventory
    ports:
      - "5432:5432"
    volumes:
      - acm_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acm_user -d acm_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: acm-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://acm_user:acm_password_dev2026@postgres:5432/acm_inventory?schema=public
      JWT_SECRET: dev-docker-jwt-secret-key-32chars-minimum-length
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: acm-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    depends_on:
      - api

volumes:
  acm_pgdata:
    driver: local
