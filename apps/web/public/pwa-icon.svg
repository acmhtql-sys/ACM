<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  
  <!-- Chip Circuit Graphics -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="256" x2="180" y2="256"/>
    <circle cx="112" cy="256" r="8" fill="#60A5FA"/>
    
    <line x1="332" y1="256" x2="392" y2="256"/>
    <circle cx="400" cy="256" r="8" fill="#60A5FA"/>
    
    <line x1="256" y1="120" x2="256" y2="180"/>
    <circle cx="256" cy="112" r="8" fill="#60A5FA"/>
    
    <line x1="256" y1="332" x2="256" y2="392"/>
    <circle cx="256" cy="400" r="8" fill="#60A5FA"/>
  </g>

  <!-- Central Chip Box -->
  <rect x="176" y="176" width="160" height="160" rx="32" fill="#0B1329" stroke="url(#glow)" stroke-width="8"/>
  
  <!-- ACM Text inside Chip -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ACM</text>
</svg>
