name: ACM Zod4 Lockfile Proposal (CI only, no database)
on:
  pull_request:
    branches:
      - codex/p3-staging-readonly-deployment-20261107
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package lock only, no script execution
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update zod --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit minimal verified Zod migration lockfile
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8',maxBuffer:4*1024*1024}));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=[...new Set([...Object.keys(before.packages),...Object.keys(after.packages)])].filter(k=>JSON.stringify(before.packages[k])!==JSON.stringify(after.packages[k]));
          console.log('ZOD4_CHANGED_PACKAGES',JSON.stringify(changed));
          const noise=/^node_modules\/(?:@esbuild\/|@rollup\/|@napi-rs\/lzma-|fsevents$)/;
          const allowed=['apps/api','packages/shared','node_modules/zod'];
          const unexpected=changed.filter(k=>!noise.test(k)&&!allowed.includes(k));
          if(unexpected.length)throw Error('Unexpected lock diff: '+unexpected.join(','));
          const minimal=structuredClone(before);
          for(const key of allowed){if(!after.packages[key])throw Error('Missing lock entry: '+key); minimal.packages[key]=after.packages[key];}
          if(minimal.packages['node_modules/zod'].version!=='4.6.7')throw Error('Incorrect Zod version');
          if(minimal.packages['apps/api'].dependencies.zod!=='4.6.7'||minimal.packages['packages/shared'].dependencies.zod!=='4.6.7')throw Error('Workspace manifests not pinned');
          const out=JSON.stringify(minimal,null,2)+'\n';
          console.log('ZOD4_MINIMAL_LOCK_LENGTH',out.length);
          for(let i=0;i<out.length;i+=3000)console.log('ZOD4_LOCK_CHUNK:'+Math.floor(i/3000)+':'+JSON.stringify(out.slice(i,i+3000)));
          console.log('ZOD4_LOCK_DONE');
          NODE
