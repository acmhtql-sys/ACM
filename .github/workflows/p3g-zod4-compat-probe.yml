name: ACM P3-G Zod 4 Compatibility Probe (no DB)
on:
  pull_request:
    branches:
      - codex/p3-staging-readonly-deployment-20261107
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: 'postgresql://acm_test:synthetic_ci_only@127.0.0.1:5432/acm_inventory_test?schema=public'
      JWT_SECRET: 'ci-zod4-probe-synthetic-only-not-real-secret'
      ACM_DEPLOYMENT_PROFILE: local_dev
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install baseline monorepo
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Check patched dependency and workspace resolution
        run: |
          node <<'NODE'
          const lock=require('./package-lock.json');
          const paths=Object.entries(lock.packages).filter(([k])=>k.endsWith('/node_modules/zod') || k==='node_modules/zod');
          console.log('Resolved Zod installations:', JSON.stringify(paths.map(([p,v])=>[p,v.version])));
          const direct=paths.filter(([p])=>p==='node_modules/zod'||p==='apps/api/node_modules/zod'||p==='packages/shared/node_modules/zod');
          if (!direct.length || direct.some(([,v])=>v.version!=='4.6.7')) throw Error('Zod 4.6.7 is not resolved for shared/API workspaces');
          NODE
          npm ls zod --all
      - name: Generate Prisma Client (CI only, no DB connection)
        run: npm run prisma:generate
      - name: Typecheck and build shared (Zod 4)
        run: npm run build:shared
      - name: Typecheck API (Zod 4)
        run: npm run typecheck --workspace=@acm/api
      - name: Build API (Zod 4)
        run: npm run build:api
      - name: Typecheck and build frontend (Zod 4)
        run: npm run build:web
      - name: Run unit tests only (no database, no secrets)
        run: npm run test:unit
