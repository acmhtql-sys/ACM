name: ACM P3-H Moderate Dependency Lockfile Proposal (review only)

on:
  pull_request:
    branches:
      - codex/p3g-zod4-compat-probe-20261107

permissions:
  contents: read

jobs:
  resolve-patched-transitives:
    if: github.head_ref == 'codex/p3h-toolchain-security-probe-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated npm resolver (no lifecycle scripts)
        run: |
          npm install -g npm@11 --no-fund --no-audit
          npm update qs postcss-selector-parser --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Verify targeted patches and emit reviewed lock entries
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const base=JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8',maxBuffer:8*1024*1024}));
          const next=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const expected={'node_modules/qs':'6.16.2','node_modules/postcss-selector-parser':'6.1.5'};
          for(const [key,version] of Object.entries(expected)){
            const entry=next.packages[key];
            if(!entry||entry.version!==version||!entry.integrity?.startsWith('sha512-')||!entry.resolved?.startsWith('https://registry.npmjs.org/'))throw Error('Invalid patched registry entry: '+key);
          }
          const changed=[...new Set([...Object.keys(base.packages),...Object.keys(next.packages)])].filter(k=>JSON.stringify(base.packages[k])!==JSON.stringify(next.packages[k]));
          console.log('P3H_MODERATE_CHANGED',JSON.stringify(changed));
          console.log('P3H_MODERATE_PATCHES',JSON.stringify(Object.fromEntries(Object.keys(expected).map(k=>[k,next.packages[k]]))));
          NODE
          npm audit --json > "$RUNNER_TEMP/p3h-moderate-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/p3h-moderate-audit.json");console.log("P3H_MODERATE_AUDIT",JSON.stringify(r.metadata?.vulnerabilities||{}));'
