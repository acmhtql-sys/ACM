name: ACM D8 Isolated RC5-Zod4 Consolidation Candidate (NO DEPLOY)

on:
  push:
    branches:
      - codex/d8-rc5-zod4-integration-20261107

permissions:
  contents: write

concurrency:
  group: acm-d8-rc5-integration-only
  cancel-in-progress: true

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NODE_ENV: test
      # Parse-only: this workflow has no PostgreSQL service and never connects
      # to a real database. CI integration is a separate isolated job.
      DATABASE_URL: postgresql://ci_fixture:never-use@127.0.0.1:65432/acm_inventory_test?schema=public
      SHADOW_DATABASE_URL: postgresql://ci_fixture:never-use@127.0.0.1:65432/acm_inventory_shadow?schema=public
      JWT_SECRET: ci-rc5-integration-only-not-prod-2026
      JWT_EXPIRES_IN: 1d
      PORT: '5000'
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout isolated branch only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated branch and known base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/d8-rc5-zod4-integration-20261107"
          git merge-base --is-ancestor 9d0e797116c72e65dd86e0fe7c5652d815851864 HEAD
          ! git merge-base --is-ancestor 17728e6d19da39f59338c159e16a40dfa22b018e HEAD
          git config user.name "ACM Isolated Consolidation CI"
          git config user.email "acm-merge-ci@users.noreply.github.com"
          echo "D8_GUARD_RC5_BASE_OK; NOTHING WILL DEPLOY"
      - name: Merge candidate and resolve exact RC5 conflicts locally
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff 17728e6d19da39f59338c159e16a40dfa22b018e > "$RUNNER_TEMP/d8-merge.txt" 2>&1
          merge_status=$?
          set -e
          echo "D8_MERGE_RETURN=$merge_status"
          if [ "$merge_status" -ne 1 ]; then
            head -55 "$RUNNER_TEMP/d8-merge.txt"
            echo "::error::Unexpected merge outcome. Expected nine explicit conflicts."
            exit 1
          fi
          python3 .github/scripts/d8_rc5_merge_resolve.py
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Conflicts remain; no commit/push"
            exit 1
          fi
          echo "D8_NINE_CONFLICTS_RESOLVED_IN_RUNNER=true"
      - name: Resolve dependency lock only on isolated CI runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11 --no-fund --no-audit
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --ignore-scripts --no-fund --no-audit
      - name: Typecheck and build all preserved RC5 modules
        shell: bash
        env:
          NODE_ENV: test
          JWT_SECRET: ci-rc5-integration-only-not-prod-2026
        run: |
          set -euo pipefail
          npm run prisma:validate
          npm run prisma:generate
          npm run build:shared
          npm run typecheck
          npm run lint
          npm run build
      - name: Run ALL RC5 zero-DB unit suites
        shell: bash
        env:
          CI: 'true'
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_fixture:never_use@127.0.0.1:65432/acm_inventory_test
          JWT_SECRET: ci-rc5-integration-only-not-prod-2026
          CORS_ORIGIN: http://127.0.0.1:4174
          PORT: '5000'
          API_PREFIX: /api/v1
        run: npm run test:unit
      - name: Show no-deploy evidence and commit only if all tests pass
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          echo "D8_OUTPUT_DIFFSTAT_BEGIN"
          git diff --cached --stat | head -80
          echo "D8_OUTPUT_DIFFSTAT_END"
          git commit -m "feat(d8): integrate RC5 feature stack and Zod4 security candidate with audited nine-conflict resolution"
          parents="$(git rev-list --parents -n1 HEAD | wc -w)"
          test "$parents" -eq 3
          echo "D8_MERGE_COMMIT=$(git rev-parse HEAD)"
          echo "D8_MERGE_PARENTS=2"
          git push origin HEAD:refs/heads/codex/d8-rc5-zod4-integration-20261107
          echo "D8_ISOLATED_BRANCH_PUSH_SUCCESS=true"
          echo "D8_MAIN_RENDER_SUPABASE_UNCHANGED=true"
